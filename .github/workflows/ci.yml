name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core + tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -S . -B build -DHT_BUILD_APP=OFF -DHT_WARNINGS_AS_ERRORS=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  linux-full:
    name: Full build + smoke test (Linux, OpenCV, MuJoCo)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      # Ubuntu's packaged OpenCV (4.6) can't import the models' Clip/ReLU6
      # nodes, so build a minimal, cached OpenCV with just the modules we use.
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build
      - name: Cache OpenCV
        id: opencv-cache
        uses: actions/cache@v4
        with:
          path: ~/opencv-install
          key: opencv-4.10.0-minimal-${{ runner.os }}-v1
      - name: Build OpenCV
        if: steps.opencv-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL https://github.com/opencv/opencv/archive/refs/tags/4.10.0.tar.gz | tar xz
          cmake -S opencv-4.10.0 -B opencv-build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=$HOME/opencv-install \
            -DBUILD_LIST=core,imgproc,imgcodecs,highgui,videoio,dnn \
            -DBUILD_TESTS=OFF -DBUILD_PERF_TESTS=OFF -DBUILD_EXAMPLES=OFF -DBUILD_opencv_apps=OFF \
            -DBUILD_JAVA=OFF -DBUILD_opencv_python3=OFF -DWITH_FFMPEG=OFF -DWITH_GTK=OFF -DWITH_QT=OFF
          cmake --build opencv-build
          cmake --install opencv-build
      - name: Download arm simulator (MuJoCo + SO-101 model)
        run: sh scripts/download_arm.sh
      - name: Configure
        run: cmake -S . -B build -G Ninja -DHT_WARNINGS_AS_ERRORS=ON -DCMAKE_BUILD_TYPE=Release -DOpenCV_DIR=$HOME/opencv-install/lib/cmake/opencv4
      - name: Build
        run: cmake --build build
      - name: Unit + simulation tests
        run: ctest --test-dir build --output-on-failure
      - name: Download models
        run: sh scripts/download_models.sh
      - name: Download test images
        # Apache-2.0 test images published by the MediaPipe project.
        run: |
          mkdir -p testimg
          for f in victory thumb_up; do
            curl -fsSL -o testimg/$f.jpg https://storage.googleapis.com/mediapipe-assets/$f.jpg
          done
      - name: End-to-end smoke test on real hand photos
        run: |
          ./build/handtracker --version
          ./build/handtracker --image testimg/victory.jpg  --output victory.annotated.png  --expect-hands 1 --expect-gesture peace
          ./build/handtracker --image testimg/thumb_up.jpg --output thumb_up.annotated.png --expect-hands 1 --expect-gesture one
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-linux
          path: "*.annotated.png"
          if-no-files-found: ignore

  windows-full:
    name: Full build + smoke test (Windows, OpenCV, MuJoCo)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - name: Install OpenCV
        run: choco install opencv -y --no-progress
      - name: Locate OpenCV
        shell: pwsh
        run: |
          $cfg = Get-ChildItem C:\tools\opencv -Recurse -Filter OpenCVConfig.cmake | Select-Object -First 1
          "OpenCV_DIR=$($cfg.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          $bin = Get-ChildItem C:\tools\opencv -Recurse -Filter "opencv_world*.dll" | Select-Object -First 1
          $bin.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Download arm simulator (MuJoCo + SO-101 model)
        shell: pwsh
        run: ./scripts/download_arm.ps1
      - name: Configure
        run: cmake -S . -B build -DHT_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Unit + simulation tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Download models
        shell: pwsh
        run: ./scripts/download_models.ps1
      - name: Download test images
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force testimg | Out-Null
          foreach ($f in "victory", "thumb_up") {
            Invoke-WebRequest "https://storage.googleapis.com/mediapipe-assets/$f.jpg" -OutFile "testimg/$f.jpg"
          }
      - name: End-to-end smoke test on real hand photos
        shell: pwsh
        run: |
          $exe = "./build/Release/handtracker.exe"
          & $exe --version
          & $exe --image testimg/victory.jpg --output victory.annotated.png --expect-hands 1 --expect-gesture peace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $exe --image testimg/thumb_up.jpg --output thumb_up.annotated.png --expect-hands 1 --expect-gesture one
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-windows
          path: "*.annotated.png"
          if-no-files-found: ignore

# Robot-arm front-end configuration  (handtracker arm)
#
# Same format as handtracker.ini; every key is optional.
# Full reference: docs/CONFIGURATION.md and docs/DASH-2_ROBOT_ARM.md

[camera]
index  = 0
width  = 640
height = 480
mirror = true

[models]
palm     = models/palm_detection_mediapipe_2023feb.onnx
landmark = models/handpose_estimation_mediapipe_2023feb.onnx

[classifier]
smoothing_frames = 5     # a fist must win a majority vote before the gripper closes

[arm]
# MuJoCo scene (downloaded by scripts/download_arm.*)
model = models/so101/scene.xml

# Calibration: hold an open palm still for this long. That pose becomes the
# centre of the workspace and the "middle" depth.
calibration_ms         = 2000
calibration_max_motion = 0.05

# How far the hand has to move (from the calibration pose) to reach the edge
# of the workspace. Smaller = less hand movement needed.
range_x     = 0.30       # fraction of the frame width, left/right
range_y     = 0.25       # fraction of the frame height, up/down
depth_range = 0.35       # log of palm-size ratio, towards/away from camera

# Reachable box in front of the arm, metres (X forward, Y left, Z up).
# Checked in simulation: every point is reachable within 0.1 mm.
workspace_min = 0.17 -0.13 0.06
workspace_max = 0.31  0.13 0.24

# Motion smoothing and safety
min_cutoff = 1.0         # One Euro filter: lower = smoother, laggier
beta       = 5.0         # One Euro filter: higher = less lag on fast moves
max_speed  = 0.6         # metres per second

# Gripper jaw angles (radians): ~0 is shut, 1.75 is fully open on the SO-101
gripper_open   = 1.2
gripper_closed = 0.0

# Inverse kinematics
ik_iterations = 10
ik_damping    = 0.05
ik_null_gain  = 0.05     # keeps the arm near a comfortable pose; don't set to 0

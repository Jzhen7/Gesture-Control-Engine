# Hand Tracker configuration
#
# Every key is optional; anything left out uses the built-in default shown here.
# Unknown keys and invalid values are reported at startup and ignored.
# Full reference: docs/CONFIGURATION.md

[camera]
index  = 0
width  = 640
height = 480
mirror = true            # selfie view: move your hand right, it moves right on screen

[models]
palm           = models/palm_detection_mediapipe_2023feb.onnx
landmark       = models/handpose_estimation_mediapipe_2023feb.onnx
palm_score     = 0.5     # palm detector confidence threshold
nms_threshold  = 0.3
landmark_score = 0.8     # landmark model confidence threshold
max_hands      = 1
tracking       = true    # reuse the previous frame's hand instead of re-detecting

[preview]
enabled    = true
topmost    = true        # keep the preview window above other windows
show_stats = true

[classifier]
finger_extension_ratio = 1.1    # higher = fingers must be straighter to count as "up"
thumb_extension_ratio  = 1.05
smoothing_frames       = 5      # majority vote window against flicker

[temporal]
swipe_window_ms     = 300
swipe_distance      = 0.15      # fraction of the frame width/height
hold_ms             = 1000
hold_max_motion     = 0.08
cooldown_ms         = 400
flip_min_separation = 0.15

[modes]
brightness_gesture   = peace    # gesture that drives the value while in the mode
volume_gesture       = three
depth_gesture        = one
exit_gesture         = palm
hand_lost_timeout_ms = 3000
volume_min_angle     = -60      # hand roll (degrees) for 0% volume
volume_max_angle     = 60       # hand roll (degrees) for 100% volume
brightness_top       = 0.2      # hand height (fraction of frame) for 100%
brightness_bottom    = 0.8      # hand height (fraction of frame) for 0%

[mouse]
margin     = 0.12      # ignore this fraction of the frame at each edge
pinch_on   = 0.25      # thumb-index distance (in palm sizes) that presses
pinch_off  = 0.35      # ...and that releases (must be > pinch_on)
min_cutoff = 1.0       # One Euro filter: lower = smoother but laggier
beta       = 0.02      # One Euro filter: higher = less lag on fast moves

# Bindings: <gesture> <event> = <action> [@process.exe]
#
#   gestures: fist peace middle one two three four palm
#             (one = thumb, two = thumb+index, three = +middle, four = +ring)
#   events:   hold swipe_left swipe_right swipe_up swipe_down flip
#   actions:  keys:<chord>   e.g. keys:ctrl+t, keys:alt+tab, keys:win+d
#             media:<key>    next prev playpause stop mute volup voldown
#             mode:<mode>    brightness volume depth
#             launch:<path or URL>
#             quit
#   @process  only fire while that process is running
#
# Defining this section replaces all default bindings. These reproduce v1.
[bindings]
fist hold          = mode:brightness
two hold           = mode:volume
four hold          = mode:depth
middle hold        = quit
one swipe_left     = media:prev   @spotify.exe
three swipe_right  = media:next   @spotify.exe
four swipe_right   = keys:ctrl+t  @chrome.exe
three flip         = keys:alt+tab
